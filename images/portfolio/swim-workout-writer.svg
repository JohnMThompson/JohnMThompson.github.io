<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Swim Workout Writer workflow</title>
  <desc id="desc">A phone screenshot flows through OCR into a reviewed swimming workout record.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="1200" height="675" rx="28" fill="url(#background)"/>
  <text x="72" y="86" fill="#0f172a" font-family="Segoe UI, sans-serif" font-size="34" font-weight="700">Swim Workout Writer</text>
  <text x="72" y="120" fill="#64748b" font-family="Segoe UI, sans-serif" font-size="19">Screenshot → OCR → Review → Database</text>
  <g filter="url(#shadow)">
    <rect x="92" y="168" width="238" height="420" rx="38" fill="#0f172a"/>
    <rect x="108" y="188" width="206" height="380" rx="28" fill="#fff"/>
    <rect x="178" y="201" width="66" height="8" rx="4" fill="#cbd5e1"/>
    <text x="135" y="256" fill="#64748b" font-family="Segoe UI, sans-serif" font-size="17">POOL SWIM</text>
    <text x="135" y="316" fill="#0f172a" font-family="Segoe UI, sans-serif" font-size="42" font-weight="700">2,400 yd</text>
    <text x="135" y="350" fill="#64748b" font-family="Segoe UI, sans-serif" font-size="18">1:02:14</text>
    <rect x="135" y="390" width="142" height="12" rx="6" fill="#bfdbfe"/>
    <rect x="135" y="420" width="112" height="12" rx="6" fill="#93c5fd"/>
    <rect x="135" y="450" width="156" height="12" rx="6" fill="#60a5fa"/>
    <rect x="135" y="498" width="142" height="42" rx="12" fill="#2563eb"/>
    <text x="170" y="525" fill="#fff" font-family="Segoe UI, sans-serif" font-size="17" font-weight="700">Upload</text>

    <rect x="420" y="245" width="190" height="190" rx="28" fill="#fff" stroke="#bfdbfe" stroke-width="3"/>
    <circle cx="515" cy="325" r="48" fill="#eff6ff"/>
    <path d="M485 325h60M515 295v60" stroke="#2563eb" stroke-width="12" stroke-linecap="round"/>
    <text x="474" y="402" fill="#334155" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700">OCR</text>

    <path d="M350 340h52M628 340h52" stroke="#2563eb" stroke-width="7" stroke-linecap="round"/>
    <path d="m390 326 16 14-16 14M668 326l16 14-16 14" fill="none" stroke="#2563eb" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="704" y="168" width="404" height="420" rx="28" fill="#fff" stroke="#dbe5f0"/>
    <text x="748" y="224" fill="#0f172a" font-family="Segoe UI, sans-serif" font-size="25" font-weight="700">Review workout</text>
    <g fill="#64748b" font-family="Segoe UI, sans-serif" font-size="15">
      <text x="748" y="270">DATE</text>
      <text x="748" y="346">DISTANCE</text>
      <text x="748" y="422">DURATION</text>
    </g>
    <g fill="#f8fafc" stroke="#cbd5e1">
      <rect x="748" y="282" width="316" height="42" rx="9"/>
      <rect x="748" y="358" width="316" height="42" rx="9"/>
      <rect x="748" y="434" width="316" height="42" rx="9"/>
    </g>
    <g fill="#334155" font-family="Segoe UI, sans-serif" font-size="18">
      <text x="764" y="309">June 13, 2026</text>
      <text x="764" y="385">2,400 yards</text>
      <text x="764" y="461">1:02:14</text>
    </g>
    <rect x="748" y="510" width="316" height="50" rx="12" fill="#2563eb"/>
    <text x="844" y="542" fill="#fff" font-family="Segoe UI, sans-serif" font-size="19" font-weight="700">Save workout</text>
  </g>
</svg>
